# Pre-commit hooks for First-Agent-dev.
#
# Philosophy (operator decision, 2026-08-11): ~90% of checks run here on
# every commit, on an i5-1235U-class machine within ~60 seconds. Only
# targeted mutation testing stays on pre-push (it depends on tests
# passing and is the last blocking layer). pip-audit runs in CI only
# (needs network, advisory DB).
#
# Ruff (check+format) runs via `language: system` so the hook uses the
# SAME binary as the .venv — two versions (mirror repo pin + uv lock)
# disagreeing previously flipped BLE001 waivers back and forth between
# `ruff check --fix` and the hook. See the comment below.
#
# All "_full-tree" hooks use `always_run: true` + `pass_filenames: false`
# so they scan the relevant scope regardless of which files changed.
# Fast per-file hooks (ruff, ruff-format, doc-links) use staged-files
# from pre-commit for speed.

default_language_version:
  python: python

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-executables-have-shebangs

  # Ruff (lint) + Ruff (format) from the PROJECT environment, not a
  # pre-commit-managed mirror clone. Rationale is at the top of this file.
  - repo: local
    hooks:
      # Per-file autofix (fast, modifies staged files and restages via
      # our pre-commit shell wrapper). Ruff `--fix` resolves import
      # sorting and mechanical lint rules deterministically.
      - id: ruff
        name: ruff --fix (project env)
        entry: ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format (project env)
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  # Full-tree fast gates (~<1s combined). deptry is src/ only by design.
  - repo: local
    hooks:
      - id: deptry
        name: deptry (src/ dependency hygiene)
        entry: deptry src/
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

  # Full-tree mid-weight gates (~25s combined on i5-1235U).
  - repo: local
    hooks:
      - id: pylint-gap
        name: pylint src/fa (duplicate-code + cyclic-import gap)
        entry: pylint src/fa
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        description: >-
          Gap profile: disable=all, enable=duplicate-code,cyclic-import only.
          Ruff does not cover cross-file copy-paste (R0801) or import-graph
          cycles (R0401).
      - id: mypy-strict
        name: mypy strict (src + tests)
        entry: mypy
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: pyrefly
        name: pyrefly (second type checker)
        entry: pyrefly check
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

  # Shell syntax: bash -n every *.sh + git hook scripts. <100 ms.
  - repo: local
    hooks:
      - id: shell-syntax
        name: shell-syntax (bash -n)
        entry: scripts/check_shell_syntax.sh
        language: system
        pass_filenames: true
        files: (\.sh$|^src/fa/hygiene/hooks/(pre-commit|pre-push|prepare-commit-msg|commit-msg)$)
        require_serial: true

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [--disable, MD013]

  # Internal-link integrity: catches dangling *relative* markdown links
  # when docs move. Dependency-free, offline, deterministic. Pre-commit
  # passes only the changed .md files; the whole-repo gate runs in CI
  # via tests/test_doc_links.py.
  - repo: local
    hooks:
      - id: check-doc-links
        name: check internal doc links
        entry: python scripts/check_doc_links.py
        language: system
        pass_filenames: true
        files: \.md$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.23
    hooks:
      - id: uv-lock
