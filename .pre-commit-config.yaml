# Use the Python interpreter running pre-commit (the project .venv). uv sync
# pins that environment to the project's supported Python version without
# requiring a system-level `python3.13` executable on PATH.
default_language_version:
  python: python

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-executables-have-shebangs

  # Ruff runs from the PROJECT environment, not a pre-commit-managed clone.
  #
  # The mirror repo (astral-sh/ruff-pre-commit) requires an immutable `rev`, so
  # it pins a ruff version independently of `pyproject.toml`'s `ruff>=0.5`. That
  # split bit us: ruff 0.16 exempts a broad `except` that logs with `exc_info=`
  # from BLE001, the pinned v0.15.18 did not, and `ruff check --fix` under the
  # newer local version stripped two `# noqa: BLE001` directives that the hook
  # then demanded back. One tool, two versions, contradictory verdicts.
  #
  # `language: system` runs whatever ruff `uv sync` installed, so the hook, the
  # `just check` gate and CI are always the same binary and always the latest
  # ruff the lockfile resolves. Upgrading is now `uv lock --upgrade-package ruff`
  # — no second place to bump, and no way for the two to disagree again.
  - repo: local
    hooks:
      # Per-file autofix (fast, modifies staged files and restages via
      # our pre-commit shell wrapper). Ruff `--fix` resolves import
      # sorting and mechanical lint rules deterministically.
      - id: ruff
        name: ruff --fix (project env)
        entry: ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format (project env)
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Full-tree static gates that are fast enough (<1s for ruff/deptry,
      # ~18s for pylint gap-checks) to run on every commit. These match
      # `just check-fast` and deliberately do NOT run mypy / pytest /
      # authoring-check (those are pre-push only). They use `always_run:
      # true` + `pass_filenames: false` so the check runs against the
      # full repo regardless of which files are staged — per-file scoping
      # here would miss a cross-file problem (unused import in one file,
      # duplicate-code between two files).
      - id: ruff-full-check
        name: ruff check (full tree, no fix)
        entry: ruff check --force-exclude .
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true
      - id: ruff-format-check
        name: ruff format --check (full tree)
        entry: ruff format --check --force-exclude .
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true
      - id: deptry
        name: deptry src/
        entry: deptry src/
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true
      - id: pylint-gap
        name: pylint (duplicate-code + cyclic-import, src/fa)
        entry: pylint src/fa
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [--disable, MD013]

  # Internal-link integrity: catches dangling *relative* markdown links when
  # docs are moved/pruned (enforces knowledge/skills/doc-maintenance/SKILL.md §When moving or
  # pruning a doc). Dependency-free, offline, deterministic — checks that local
  # file targets exist (anchor validation is opt-in via --anchors, off here to
  # avoid slug-algorithm noise). Pre-commit passes only the changed .md files,
  # so the hook judges only what a commit touches. The whole-repo gate runs in
  # CI via tests/test_doc_links.py, mirroring check_protected_paths.py.
  - repo: local
    hooks:
      - id: check-doc-links
        name: check internal doc links
        entry: python scripts/check_doc_links.py
        language: system
        pass_filenames: true
        files: \.md$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.23
    hooks:
      - id: uv-lock
