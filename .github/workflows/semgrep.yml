name: Semgrep

# Weekly full-repo Semgrep OSS scan. Advisory (continue-on-error: true).
# Intra-procedural only (Semgrep OSS free tier). Blocking push-time Semgrep
# is handled by targeted-semgrep in advisory.yml (changed files only).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"  # weekly, Sunday 00:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep-oss (weekly, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      # uvx does not require uv sync; semgrep resolves via one-shot download.
      # Pin version matches [tool.ci-pins].semgrep in pyproject.toml;
      # tests/test_semgrep_pin.py enforces drift = red.
      - name: Run Semgrep (advisory SAST, pinned 1.172.0)
        run: uvx --from semgrep==1.172.0 semgrep scan --quiet --config=p/python --config=p/owasp-top-ten
