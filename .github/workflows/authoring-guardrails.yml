name: Authoring Guardrails

# Level-0 authoring kernel (ADR-11 two-tier TCB). Always-run (no paths: filter
# per ADR-11-I6 — CI is the authority, not pre-commit). Blocking.

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authoring-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Install package
        run: uv sync --frozen --extra dev
      - name: Run Level-0 authoring kernel (always reports)
        run: uv run fa authoring-check --output json
      - name: Surface protected-path edits (flag for human review)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run python scripts/check_protected_paths.py --base "origin/$BASE_REF"
