name: CI

# Primary CI workflow. Blocking jobs run in parallel for every PR and push to
# main; advisory jobs (continue-on-error: true) add extra signal without
# blocking the merge.
#
# Gates converge on `uv run just check` / `uv run just check-deep`, which are
# the same commands the local pre-push hook runs. There is no CI-only magic —
# any gate that fails here also fails on a developer's machine.
#
# pip-audit is CI-only (network access, advisory DB). Targeted-mutmut and
# targeted-semgrep are pre-push + CI (blocking, changed-files scope). Full
# mutmut / full semgrep stay on weekly cron in tests.yml / semgrep.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap sub-second preflight: uv lock check + `just doctor`. Catches a stale
  # uv.lock or missing hooks/venv in seconds before we pay for uv sync.
  doctor-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Check uv.lock
        run: uv lock --check
      # NOTE: no `uv sync` here — doctor is a READ-ONLY preflight. It requires
      # only uv + just + python (all on PATH after setup-uv / setup-just /
      # the runner image); in CI mode it skips the hook-presence check and
      # treats a missing .venv as OK (each parallel downstream job performs
      # its own `uv sync`). CI=true is exported so just doctor knows to relax
      # the local-only hooks/venv requirements.
      - name: Doctor
        run: just doctor
        env:
          CI: "true"

  # Authoritative blocking gate: runs `just check` (non-mutational) and uploads
  # coverage. Pre-push hook runs `just check-deep` which extends this with the
  # two targeted heavy gates; those live in separate parallel jobs below so
  # they don't block the test run.
  sanity-check:
    runs-on: ubuntu-latest
    needs: doctor-preflight
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: Run checks (ruff+deptry+pylint+mypy+pyrefly+authoring+contracts+shell-syntax+pytest+coverage-floor)
        run: uv run just check
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # Network-only SCA: pip-audit. Blocking, CI-only (needs PyPI advisory DB).
  pip-audit:
    runs-on: ubuntu-latest
    needs: doctor-preflight
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: Run pip-audit (SCA floor)
        run: uv run pip-audit

  # Secret scanning — gitleaks.
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks detect
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Pin must match rev in .pre-commit-config.yaml.
          GITLEAKS_VERSION: "8.30.1"

  # Targeted mutation testing (last blocking layer). Only changed files, 10-min cap.
  targeted-mutmut:
    runs-on: ubuntu-latest
    needs: doctor-preflight
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: Targeted mutation testing (changed files only)
        run: uv run just _targeted-mutmut

  # Targeted Semgrep (last blocking layer). Only changed files, 2-min cap.
  targeted-semgrep:
    runs-on: ubuntu-latest
    needs: doctor-preflight
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Targeted Semgrep (changed files only)
        run: uv run just _targeted-semgrep

  # Docker image build + runtime-user smoke tests (slow, parallel).
  container-build:
    name: container-build + smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build the FA image
        run: docker build -f Dockerfile.fa -t fa-image:ci .
      - name: Smoke-test as the runtime user (numeric 1000:1000)
        run: |
          set -euo pipefail
          docker run --rm --user 1000:1000 --read-only --tmpfs /tmp fa-image:ci fa --version
      - name: Smoke-test egress-proxy subcommand --help
        run: |
          set -euo pipefail
          docker run --rm --user 1000:1000 --read-only --tmpfs /tmp fa-image:ci fa egress-proxy --help >/dev/null
      - name: Session workspace isolation
        run: |
          set -euo pipefail
          mkdir -p /tmp/fa-ci-repo /tmp/fa-ci-sessions /tmp/fa-ci-state
          trap 'sudo rm -rf /tmp/fa-ci-repo /tmp/fa-ci-sessions /tmp/fa-ci-state' EXIT
          cd /tmp/fa-ci-repo
          git init -q
          git config user.email "ci@test" && git config user.name "ci"
          git commit --allow-empty -q -m "init"
          git remote add origin git@github.com:first-agent-dev/First-Agent-dev.git
          cd -
          sudo chown 1000:1000 /tmp/fa-ci-sessions /tmp/fa-ci-state
          timeout --foreground --kill-after=10s 300s docker run --rm --user 1000:1000 --read-only \
            --tmpfs /tmp \
            --tmpfs /home/fa/.cache:rw,nosuid,nodev,exec,size=1536m,mode=0700,uid=1000,gid=1000 \
            --tmpfs /home/fa/.local:rw,nosuid,nodev,exec,size=500m,mode=0700,uid=1000,gid=1000 \
            -v /tmp/fa-ci-repo:/repo:ro \
            -v /tmp/fa-ci-sessions:/sessions \
            -v /tmp/fa-ci-state:/home/fa/.fa \
            -e FA_SESSION_ID=ci-smoke -e FA_RUN_ID=ci-run-1 \
            fa-image:ci bash -c '
              set -euo pipefail
              test -d /sessions/ci-smoke/.git
              test -f /sessions/.active
              test "$PWD" = "/sessions/ci-smoke"
              for dir in /home/fa/.cache /home/fa/.local; do
                test -w "$dir"
                probe="$dir/.fa-exec-probe"
                printf "#!/bin/sh\nexit 0\n" >"$probe"
                chmod 700 "$probe"
                "$probe"
                rm -f "$probe"
              done
              fa --version'
          timeout --foreground --kill-after=10s 300s docker run --rm --user 1000:1000 --read-only \
            --tmpfs /tmp \
            --tmpfs /home/fa/.cache:rw,nosuid,nodev,exec,size=1536m,mode=0700,uid=1000,gid=1000 \
            --tmpfs /home/fa/.local:rw,nosuid,nodev,exec,size=500m,mode=0700,uid=1000,gid=1000 \
            -v /tmp/fa-ci-repo:/repo:ro \
            -v /tmp/fa-ci-sessions:/sessions \
            -v /tmp/fa-ci-state:/home/fa/.fa \
            -e FA_RUN_ID=ci-runonly \
            fa-image:ci bash -c '
              set -euo pipefail
              if [ -d /sessions/ci-runonly/.git ]; then
                echo "V26 REGRESSION: FA_RUN_ID selected the session workspace" >&2
                exit 1
              fi'

  # ---------------------------------------------------------------------------
  # Advisory jobs (continue-on-error: true)
  # ---------------------------------------------------------------------------

  # Dead code scan (vulture). Full src/, not just changed files. Non-blocking.
  deadcode:
    runs-on: ubuntu-latest
    needs: doctor-preflight
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: Vulture dead-code scan (advisory)
        run: uv run vulture src/ --min-confidence 90

  # Self-test: in this workflow and the other three, no blocking job
  # uses `paths:` filters (ADR-11-I6) and no blocking job has a
  # constant-false `if:` guard (trivial bypass).
  # NOTE: first round is continue-on-error: true (advisory); promote to
  # blocking after one week of green CI (see PLAN-postv3 Q2).
  workflow-hygiene:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install Python dependencies (PyYAML used by hygiene checker)
        run: uv sync --frozen --extra dev
      - name: Workflow hygiene (no path filters, no if:false bypass)
        run: uv run python scripts/check_workflow_hygiene.py

  # Advisory lint of scripts/ — pylint (gap profile) + mypy in non-strict mode.
  # scripts/ are dev/CI helpers, not production code; findings here are surfaced
  # but do not block the build.
  scripts-lint:
    runs-on: ubuntu-latest
    needs: doctor-preflight
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: pylint (scripts/, gap profile, advisory)
        run: uv run pylint --disable=all --enable=E,F,R0801,R0401 scripts/
      - name: mypy (scripts/, non-strict, advisory)
        run: uv run mypy --config-file=/dev/null --ignore-missing-imports scripts/
