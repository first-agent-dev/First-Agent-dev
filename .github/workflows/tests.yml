name: Mutation testing

# Weekly full-scope mutation testing. Advisory (continue-on-error) until the
# survivor workplan is cleared; on push/PR, targeted-mutmut in advisory.yml
# covers changed files. This workflow runs mutmut against the full
# [tool.mutmut] source_paths (sandbox + substrate).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: mutation testing (weekly, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Sanity — fa resolves to the checked-out tree (editable install)
        run: |
          uv run python - <<'PYEOF'
          import pathlib
          import fa
          p = pathlib.Path(fa.__file__).resolve()
          root = pathlib.Path("src").resolve()
          assert str(p).startswith(str(root)), f"fa resolved outside workspace: {p}"
          print("fa ->", p)
          PYEOF
      - name: Run mutation testing (scope = pyproject [tool.mutmut])
        # NOTE: mutmut 3.x removed --paths-to-mutate; scope lives only in pyproject.
        run: uv run mutmut run
      - name: Export stats to job summary
        if: always()
        run: |
          uv run mutmut export-cicd-stats || true
          {
            echo '## Mutation testing (src/fa/sandbox + substrate)'
            echo '```json'
            cat mutants/mutmut-cicd-stats.json 2>/dev/null || echo '{"error": "stats file missing"}'
            echo ''
            echo '```'
            echo 'Survivor-clearing tracker: knowledge/mutation-survivors-workplan.md'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: List survivors
        if: always()
        run: uv run mutmut results || true
      - name: Upload stats artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-stats
          path: mutants/mutmut-cicd-stats.json
          retention-days: 90
          if-no-files-found: warn
